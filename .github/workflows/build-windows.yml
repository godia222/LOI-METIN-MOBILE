
name: Build LOI METIN MOBILE for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Verificar projeto
        run: godot --headless --path . --editor --quit

      - name: Compilar Windows
        run: godot --headless --path . --export-release "Windows Desktop" build/LOI_METIN.exe

      - name: Disponibilizar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LOI-METIN-WINDOWS
          path: build/
